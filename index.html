<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller Gary · Sistema de Gestión</title>
<style>
  :root{
    --ink:#24262b; --muted:#71767f;
    --gold:#b8860b; --gold2:#caa24a; --gold-d:#8a6a10;
    --gold-soft:rgba(184,134,11,.12); --gold-line:rgba(184,134,11,.22);
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78);
    --line:rgba(40,45,60,.10);
    --ok:#1f9d63; --bad:#d4483d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;min-height:100%}
  body{
    background:
      radial-gradient(820px 480px at 6% -10%, rgba(202,162,74,.20), transparent 60%),
      radial-gradient(720px 480px at 110% -4%, rgba(184,134,11,.12), transparent 55%),
      radial-gradient(680px 520px at 100% 108%, rgba(202,162,74,.14), transparent 60%),
      linear-gradient(180deg,#ffffff,#f8f5ee);
    background-attachment:fixed;
  }
  a{color:var(--gold-d);text-decoration:none}
  .serif{font-family:Georgia,"Times New Roman",serif}

  /* ---------- HEADER ---------- */
  header{display:flex;align-items:center;gap:14px;padding:11px 20px;
    background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
    border-bottom:1px solid var(--gold-line);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{display:block;filter:drop-shadow(0 3px 8px rgba(120,95,20,.25))}
  .grow{flex:1}
  .pill{font-size:11px;color:var(--gold-d);background:var(--gold-soft);border:1px solid var(--gold-line);
    padding:5px 11px;border-radius:20px;font-weight:600}

  /* ---------- NAV ---------- */
  nav{display:flex;gap:4px;padding:8px 14px;
    background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:59px;z-index:19;overflow-x:auto}
  nav button{background:transparent;border:none;color:var(--muted);padding:9px 14px;border-radius:9px;
    cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.15s}
  nav button.active{background:var(--gold-soft);color:var(--gold-d);box-shadow:inset 0 0 0 1px var(--gold-line)}
  nav button:hover{color:var(--ink)}
  nav .ic{font-size:15px}

  main{padding:24px 18px;max-width:1120px;margin:0 auto}

  /* ---------- GLASS BASE ---------- */
  .glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid var(--glass-strong);box-shadow:0 10px 30px rgba(90,75,25,.08),0 1px 0 rgba(255,255,255,.6) inset}

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 24px;margin-bottom:22px;
    background:linear-gradient(125deg, rgba(255,255,255,.72), rgba(202,162,74,.14));
    -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid var(--gold-line);box-shadow:0 16px 40px rgba(120,95,20,.10)}
  .hero-logo{position:relative;display:inline-block;margin-bottom:10px;padding:10px 6px}
  .hero-logo::before{content:'';position:absolute;inset:-10px;background:radial-gradient(ellipse at center, rgba(202,162,74,.35), transparent 70%);
    z-index:-1;filter:blur(6px)}
  .hero-logo img{height:170px;display:block;filter:drop-shadow(0 8px 20px rgba(120,95,20,.28))}
  @media(max-width:640px){.hero-logo img{height:120px}}
  .hero h1{margin:0 0 6px;font-size:23px;font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.2px}
  .hero p{margin:0;color:var(--muted);max-width:640px;font-size:14px}

  /* ---------- MODULE CARDS ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
  .mod{border-radius:16px;padding:18px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:6px;min-height:152px;
    background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid var(--glass-strong);box-shadow:0 8px 24px rgba(90,75,25,.07)}
  .mod:hover{transform:translateY(-3px);border-color:var(--gold-line);
    background:var(--glass-strong);box-shadow:0 16px 34px rgba(140,110,25,.18)}
  .mod .top{display:flex;align-items:center;justify-content:space-between}
  .mod .icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:21px;background:var(--gold-soft);border:1px solid var(--gold-line)}
  .mod h3{margin:8px 0 0;font-size:15.5px;font-family:Georgia,serif;font-weight:700}
  .mod p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.45;flex:1}
  .badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.4px}
  .b-soon{background:var(--gold-soft);color:var(--gold-d);box-shadow:inset 0 0 0 1px var(--gold-line)}
  .b-ready{background:rgba(31,157,99,.14);color:#157a4b;box-shadow:inset 0 0 0 1px rgba(31,157,99,.3)}
  .b-pend{background:var(--gold-soft);color:var(--gold-d);box-shadow:inset 0 0 0 1px var(--gold-line)}
  .b-acept{background:rgba(31,157,99,.14);color:#157a4b;box-shadow:inset 0 0 0 1px rgba(31,157,99,.3)}
  .b-rech{background:rgba(212,72,61,.12);color:#a83226;box-shadow:inset 0 0 0 1px rgba(212,72,61,.28)}
  .btn.ok{background:linear-gradient(180deg,#2fb877,#1f9d63);box-shadow:0 4px 12px rgba(31,157,99,.3)}
  .btn.danger{background:linear-gradient(180deg,#e0665a,#d4483d);box-shadow:0 4px 12px rgba(212,72,61,.3)}

  /* ---------- MODULE PAGE ---------- */
  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .page-head .icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:25px;background:var(--gold-soft);border:1px solid var(--gold-line)}
  .page-head h1{margin:0;font-size:21px;font-family:Georgia,serif;font-weight:700}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .panel{border-radius:16px;padding:20px;margin-bottom:16px;
    background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid var(--glass-strong);box-shadow:0 8px 24px rgba(90,75,25,.07)}
  .panel h2{margin:0 0 12px;font-size:15px;font-family:Georgia,serif}
  .feat{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .feat:last-child{border-bottom:none}
  .feat .dot{color:var(--gold);font-size:15px;line-height:1.3}
  .feat b{display:block;font-size:13.5px}
  .feat span{color:var(--muted);font-size:12.5px}
  .construction{display:flex;align-items:center;gap:14px;border-radius:14px;padding:16px 18px;margin-bottom:16px;
    background:linear-gradient(100deg, rgba(255,255,255,.6), rgba(202,162,74,.16));
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px dashed var(--gold-line)}
  .construction .big{font-size:30px}
  .construction b{font-size:14px}
  .construction p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
  .btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#fff;border:none;padding:9px 15px;
    border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(184,134,11,.28)}
  .btn:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent;border:1px solid var(--gold-line);color:var(--ink);box-shadow:none}
  .btn.ghost:hover{background:var(--gold-soft)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .backlink{color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}
  .backlink:hover{color:var(--gold-d)}
  .conn{display:inline-block;font-size:11px;background:var(--gold-soft);color:var(--gold-d);padding:3px 9px;
    border-radius:6px;margin-top:4px;border:1px solid var(--gold-line)}
  footer{max-width:1120px;margin:20px auto 44px;padding:0 18px;color:var(--muted);font-size:12px;text-align:center}

  /* ---------- Toasts y confirmación propia ---------- */
  #toastBox{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:#242a24;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:1;transition:opacity .3s,transform .3s;max-width:90vw}
  .toast.err{background:linear-gradient(180deg,#e0665a,#c8392e)}
  .toast.out{opacity:0;transform:translateY(8px)}
  .confirm-bg{position:fixed;inset:0;background:rgba(20,15,5,.45);z-index:210;display:flex;align-items:center;justify-content:center;padding:20px}
  .confirm-box{background:#fffdf8;border:1px solid var(--gold-line);border-radius:16px;padding:22px;max-width:380px;
    box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .confirm-box p{margin:0;font-size:14px;color:var(--ink);line-height:1.5}
  .confirm-box.wide{max-width:640px;width:100%;max-height:82vh;display:flex;flex-direction:column}

  /* ---------- Foto de bandera ---------- */
  .foto-box{display:flex;gap:12px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
  .foto-preview{width:84px;height:60px;border-radius:10px;border:1px dashed var(--gold-line);background:#fff;
    overflow:hidden;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:border-color .15s,background .15s}
  .foto-preview img{width:100%;height:100%;object-fit:cover}
  .foto-empty{color:var(--muted);font-size:9.5px;text-align:center;padding:4px;line-height:1.35}
  .foto-preview.drag-over{border-color:var(--gold);background:var(--gold-soft)}
  .foto-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- Galería de fotos ---------- */
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;overflow-y:auto;padding-right:4px}
  .gal-item{cursor:pointer;border:1px solid var(--gold-line);border-radius:10px;overflow:hidden;background:#fff;transition:.15s}
  .gal-item:hover{border-color:var(--gold);transform:translateY(-2px)}
  .gal-item img{width:100%;height:80px;object-fit:cover;display:block}
  .gal-name{font-size:11px;padding:5px 7px 6px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Resultados de búsqueda anterior ---------- */
  .resultado-ant{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center;gap:10px}
  .resultado-thumb{width:34px;height:24px;object-fit:cover;border-radius:5px;margin-right:8px;vertical-align:middle;border:1px solid var(--gold-line)}
  .tag{display:inline-block;color:var(--muted);background:var(--gold-soft);padding:1px 6px;border-radius:5px;margin-top:2px}

  /* ---------- Tela / Crea (cálculo automático) ---------- */
  .tela-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
  .tela-result{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:6px 2px 16px;flex-wrap:wrap;gap:6px}
  .tela-result b{color:var(--ink)}
  .crea-grid{display:grid;grid-template-columns:1.5fr 1fr 1.6fr;gap:10px;align-items:end;margin-bottom:16px}
  .crea-check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--ink);padding-bottom:9px}
  .crea-check input{width:16px;height:16px}
  @media(max-width:760px){.tela-grid,.crea-grid{grid-template-columns:1fr}.crea-check{padding-bottom:0}}

  /* ---------- Encabezado de ítem (miniatura + título + eliminar) ---------- */
  .item-card-head{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;flex:0 0 auto;
    margin:0 -20px 12px;padding:20px 20px 14px;
    border-bottom:1px solid var(--glass-strong)}
  .item-card-head-mini{flex:0 0 auto;width:34px;height:26px;border-radius:6px;overflow:hidden;
    border:1px solid var(--gold-line);background:#fff}
  .item-card-head-mini img{width:100%;height:100%;object-fit:cover;display:block}
  .item-card-head h2{margin:0;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item-card-head .del-item{flex:0 0 auto}

  /* ---------- Galería / listado en modal (reutilizado por plantillas) ---------- */

  /* ---------- Costeo de tela y crea (filas consolidadas) ---------- */
  .tela-costeo-head{display:grid;grid-template-columns:1fr .8fr 1fr 1fr;gap:8px;color:var(--muted);
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 8px}
  .tela-costeo-row{display:grid;grid-template-columns:1fr .8fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
  .tela-costeo-row .tela-cant,.tela-costeo-row .crea-cant{font-weight:700}
  @media(max-width:640px){.tela-costeo-head{display:none}.tela-costeo-row{grid-template-columns:1fr}}
  .tela-costeo-row.subtotal{border-top:1px dashed var(--gold-line);padding-top:8px;margin-top:2px;font-weight:600;font-size:12.5px;color:var(--muted)}
  .tela-costeo-row.subtotal .right{color:var(--ink);font-weight:700}

  /* ---------- Confección (misma grilla que Telas/Accesorios, para que "Costo" quede alineado con "Costo unit."; sin Cantidad visible) ---------- */
  .confeccion-head{display:grid;grid-template-columns:1fr .8fr 1fr 1fr;gap:8px;color:var(--muted);
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin:10px 0 8px}
  .confeccion-row{display:grid;grid-template-columns:1fr .8fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px;font-size:13px}
  .confeccion-row.subtotal{border-top:1px dashed var(--gold-line);padding-top:8px;margin-top:2px;font-weight:600;font-size:12.5px;color:var(--muted)}
  .confeccion-row.subtotal .right{color:var(--ink);font-weight:700}
  .confeccion-row.warn{background:#fdecea;border-radius:8px;padding:4px 6px;margin:0 -6px 8px}
  .confeccion-row input.warn{border-color:#d4483d;background:#fff5f4}
  .warn-tag{color:#c0392b;font-size:10px;font-weight:700;margin-left:6px}
  @media(max-width:640px){.confeccion-head{display:none}.confeccion-row{grid-template-columns:1fr}}
  .section-title{font-family:Georgia,"Times New Roman",serif;font-weight:800;font-size:16px;color:var(--gold-d);
    margin:16px 0 8px;display:flex;align-items:center;gap:8px}
  .unidad{color:var(--muted);font-weight:500;font-size:12px}
  .argolla-cant-cell{display:flex;align-items:center;gap:5px;font-size:12.5px}
  .argolla-cant-cell input{width:52px;padding:5px 6px}

  /* ---------- Mantenedor de argollas ---------- */
  .argollas-head{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;color:var(--muted);
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin:8px 0}
  .argollas-fila{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:7px;align-items:center}
  .ta-del{background:linear-gradient(180deg,#e0665a,#d4483d);border:none;color:#fff;border-radius:9px;width:32px;height:34px;cursor:pointer}

  /* ---------- PRODUCCIÓN ---------- */
  .prod-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .prod-head h1{margin:0;font-size:21px;font-family:Georgia,serif;font-weight:700}
  .prod-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .prod-cloud-pill{display:inline-block;margin-top:6px;cursor:pointer}
  .prod-cloud-pill.cargando{color:var(--gold-d)}
  .prod-cloud-pill.nube{color:#157a4b;background:rgba(31,157,99,.14);border-color:rgba(31,157,99,.3)}
  .prod-cloud-pill.nube-error{color:#a83226;background:rgba(212,72,61,.12);border-color:rgba(212,72,61,.28)}
  .prod-cloud-pill.no-disponible{color:var(--muted);background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1)}
  .prod-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .prod-stat{flex:1;min-width:96px;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:center;
    background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);transition:.15s}
  .prod-stat:hover{box-shadow:inset 0 0 0 1px var(--gold-line)}
  .prod-stat.active{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
  .prod-stat b{display:block;font-size:19px;font-family:Georgia,serif;color:var(--ink)}
  .prod-stat span{font-size:10px;color:var(--muted)}
  .prod-stat.warn b{color:#c0392b}
  .prod-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .prod-toolbar .search{flex:1;min-width:220px}
  .prod-tabs{display:flex;gap:4px;background:var(--gold-soft);border-radius:10px;padding:3px}
  .prod-tabs button{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--gold-d)}
  .prod-tabs button.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--ink)}
  .prod-bulkbar{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border-radius:12px;
    padding:9px 14px;margin-bottom:12px;font-size:13px;box-shadow:inset 0 0 0 1px var(--gold-line);flex-wrap:wrap}
  .prod-bulkbar b{color:var(--gold-d)}
  .prod-table-wrap{overflow-x:auto;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);background:#fff}
  table.prod-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1180px}
  .prod-table thead th{position:sticky;top:0;background:#faf7ef;color:var(--muted);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .prod-table td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .prod-table tr:last-child td{border-bottom:none}
  .prod-table tr.entregada{opacity:.55}
  .prod-table tr.sel{background:var(--gold-soft)}
  .prod-table input{width:100%;border:1px solid transparent;border-radius:7px;padding:5px 6px;
    font-size:12.5px;font-family:inherit;background:transparent}
  .prod-table input:hover{border-color:var(--line)}
  .prod-table input:focus{border-color:var(--gold);background:#fff}
  .prod-table td.num input{text-align:center}
  .prod-thumb-cell{width:52px;height:38px;border-radius:8px;overflow:hidden;cursor:pointer;border:1px dashed var(--gold-line);
    display:flex;align-items:center;justify-content:center;background:#fdfaf3}
  .prod-thumb-cell img{width:100%;height:100%;object-fit:cover;display:block}
  .prod-thumb-cell span{font-size:16px;color:var(--gold-d)}
  .prod-dif{font-weight:700}
  .prod-dif.late{color:#c0392b}
  .prod-dif.ok{color:#157a4b}
  .prod-flags{display:flex;gap:4px}
  .prod-flag{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;
    font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .prod-flag.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-d)}
  .prod-row-actions{display:flex;gap:4px;white-space:nowrap}
  .prod-mini{width:26px;height:26px;border-radius:7px;border:none;cursor:pointer;font-size:12px;
    display:flex;align-items:center;justify-content:center}
  .prod-mini.del{background:linear-gradient(180deg,#e0665a,#d4483d);color:#fff}
  .prod-mini.ok{background:linear-gradient(180deg,#2fb877,#1f9d63);color:#fff}
  .prod-mini.ghost{background:var(--gold-soft);color:var(--gold-d)}
  .prod-empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13px}
  .prod-lightbox{position:fixed;inset:0;background:rgba(20,15,5,.72);z-index:220;display:flex;align-items:center;justify-content:center;padding:24px}
  .prod-lightbox img{max-width:92vw;max-height:78vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .prod-table tr.grupo-sep td{border-top:2px solid var(--gold-line)}
  .ot-doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  .ot-doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px;margin-bottom:16px}
  .ot-doc-grid label{margin-bottom:2px}
  .ot-doc-grid > div > div{font-size:13px}
  .ot-doc-items{width:100%;border-collapse:collapse}
  .ot-doc-items th,.ot-doc-items td{border-bottom:1px solid var(--line);padding:8px 6px;font-size:12.5px;text-align:left}
  @media(max-width:640px){.ot-doc-grid{grid-template-columns:1fr 1fr}}
  .prod-mini.anexo{width:auto;min-width:26px;padding:0 8px;font-size:11.5px;gap:3px}
  .anexo-lista{max-width:420px}
  .anexo-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .anexo-item:last-child{border-bottom:none}
  .anexo-item-info{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;flex:1;min-width:0}
  .anexo-item-info:hover{color:var(--gold-d)}
  .anexo-ico{font-size:16px;flex:0 0 auto}
  .hoja-box{max-width:900px}
  .hoja-scroll{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:8px;background:#e9e9e9;padding:14px}
  .hoja-lienzo{position:relative;background:#fff;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:Calibri,Arial,sans-serif}
  .hoja-celda{position:absolute;display:flex;align-items:center;padding:0 4px;box-sizing:border-box;
    color:#111;overflow:hidden;white-space:pre;line-height:1.1}
  .hoja-img{position:absolute;object-fit:contain}
  .prod-import textarea{width:100%;min-height:160px;font-family:ui-monospace,monospace;font-size:11.5px;padding:10px;

  /* ---------- FORMULARIOS / TABLAS ---------- */
  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:700;letter-spacing:.2px}
  input,select,textarea{background:rgba(255,255,255,.75);border:1px solid var(--gold-line);color:var(--ink);
    border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  input:disabled{color:var(--muted);background:rgba(0,0,0,.03)}
  .field{margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  .muted{color:var(--muted)}
  .right{text-align:right}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:800}
  tbody tr:hover td{background:rgba(184,134,11,.06)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .item-row{display:grid;grid-template-columns:1.7fr 1fr .7fr .9fr .9fr auto;gap:8px;margin-bottom:8px;align-items:center}
  .item-row-head{display:grid;grid-template-columns:1.7fr 1fr .7fr .9fr .9fr auto;gap:8px;color:var(--muted);
    font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .item-row .del{background:linear-gradient(180deg,#e0665a,#d4483d);border:none;color:#fff;border-radius:9px;
    width:34px;height:36px;cursor:pointer;font-size:14px}
  .item-row .it-subtotal{padding:0 4px;font-weight:700}

  /* ---------- Motor de costeo por ítem ---------- */
  .item-card{border-left:3px solid var(--gold)}
  /* Ítems en fila horizontal (uno al lado del otro) para poder comparar producto por producto,
     igual que las columnas del Excel de costeo. Se desplaza con scroll lateral.
     Todos los ítems se mueven junto con el scroll de toda la página (no tienen scroll propio). */
  #itemsCot{display:flex;flex-direction:row;align-items:flex-start;gap:16px;
    overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
  #itemsCot .item-card{flex:0 0 460px;width:460px;margin-bottom:0;scroll-snap-align:start;
    display:flex;flex-direction:column;padding-top:0}
  #itemsCot .item-card .item-body{padding:0 20px 20px}
  @media(max-width:760px){#itemsCot .item-card{flex-basis:88vw;width:88vw}}
  .del-item{background:linear-gradient(180deg,#e0665a,#d4483d);border:none;color:#fff;border-radius:9px;
    cursor:pointer;font-size:13px}
  .cost-summary{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:7px}
  .cs-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
  .cs-row span{color:var(--muted);display:flex;align-items:center;gap:8px}
  .cs-row .pct{width:64px;padding:5px 7px;font-size:12px;text-align:right}
  .confeccion-row .pct{width:100%;padding:6px 8px;font-size:13px;text-align:right}
  .cs-row.sub{border-top:1px dashed var(--gold-line);padding-top:7px;font-weight:700}
  .cs-row.sub span{color:var(--ink)}
  .cs-row.hl{background:var(--gold-soft);border-radius:9px;padding:8px 12px;font-family:Georgia,serif}
  .cs-row.hl span{color:var(--gold-d);font-family:inherit}
  .cs-row.hl.big{background:linear-gradient(120deg,var(--gold-soft),rgba(202,162,74,.22));font-size:16px}
  .cs-row.hl.big b{font-size:19px}
  .margen-escenarios{display:grid;grid-template-columns:repeat(4,1fr) 1.3fr;gap:8px;margin-bottom:10px}
  .margen-esc{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;cursor:pointer;
    background:#fff;display:flex;flex-direction:column;gap:2px;font-family:inherit}
  .margen-esc.active{border-color:var(--gold);background:var(--gold-soft)}
  .margen-esc .me-pct{font-weight:700;font-size:13px;color:var(--ink)}
  .margen-esc .me-monto{font-size:12px;color:var(--muted)}
  .margen-esc.active .me-monto{color:var(--gold-d)}
  .margen-manual{cursor:default}
  .margen-manual .me-pct{display:flex;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-weight:600;font-size:12px}
  .margen-manual input{width:46px;padding:4px 6px;font-size:12px;text-align:right}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}
    .margen-escenarios{grid-template-columns:repeat(2,1fr)}}
</style>

/* ============================ NAVEGACIÓN ============================ */
let current='inicio';
const nav=document.getElementById('nav');
MODULES.forEach(m=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="ic">${m.icon}</span>${m.nav}`;
  b.onclick=()=>go(m.id);
  b.dataset.id=m.id;
  nav.appendChild(b);
});
function go(id){ current=id; window.scrollTo(0,0);
  [...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  render();
}

function badge(status){
  return status==='ready'
    ? '<span class="badge b-ready">● LISTO</span>'
    : '<span class="badge b-soon">EN DESARROLLO</span>';
}

/* ============================ RENDER ============================ */
function render(){
  const app=document.getElementById('app');
  app.className = '';
  if(current==='inicio'){ app.innerHTML=renderInicio(); bindCards(); return; }
  const m=MODULES.find(x=>x.id===current);
  app.innerHTML=renderModule(m);
  if(current==='costos'){
    if(costosView==='detalle') bindDetalleCotizacion();
    else bindCostosForm();
  }
  if(current==='mercado') bindMercadoForm();
  if(current==='produccion') bindProduccion();
}

function renderInicio(){
  const cards=MODULES.filter(m=>!m.hideCard);
  return `
    <div class="hero">
      <div class="hero-logo"><img src="${LOGO_FULL}" alt="Taller Gary — 40 años de excelencia y tradición"></div>
      <h1>Sistema de gestión del Taller Gary</h1>
      <p>Un solo lugar para todo el flujo, desde la licitación en Mercado Público hasta el pago. Elige un módulo para entrar.</p>
    </div>
    <div class="grid">
      ${cards.map(m=>`
        <div class="mod" data-id="${m.id}">
          <div class="top"><div class="icon">${m.icon}</div>${badge(m.status)}</div>
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
        </div>`).join('')}
    </div>`;
}
function bindCards(){ document.querySelectorAll('.mod').forEach(c=>c.onclick=()=>go(c.dataset.id)); }

function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDateCL(d){ if(!d) return ''; const [y,mo,da]=d.split('-'); return `${da}/${mo}/${y}`; }

/* Cuenta en cuántos ítems de cotizaciones YA GUARDADAS se está usando esta foto ahora mismo.
   No es un contador que se va sumando: se recalcula cada vez mirando el estado actual, así que
   si editas un ítem y le cambias la foto, el reemplazo queda reflejado altiro (no queda "pegado" en 1). */
function contarUsosFotoGuardada(imgDataUrl){
  if(!imgDataUrl) return 0;
  let n=0;
  (COSTOS.cotizaciones||[]).forEach(c=>(c.items||[]).forEach(it=>{ if(it.foto===imgDataUrl) n++; }));
  return n;
}
function normalizarNombre(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }

function argollasPorMedida(ancho, alto){
  const filas=TABLA_ARGOLLAS.filas||[];
  if(!filas.length || !(ancho&&alto)) return 0;
  const L=Math.max(ancho,alto), A=Math.min(ancho,alto);
  let mejor=filas[0], mejorDist=Infinity;
  filas.forEach(f=>{ const d=Math.hypot(f.largo-L, f.alto-A); if(d<mejorDist){ mejorDist=d; mejor=f; } });

/* Se compara el LARGO (la dimensión mayor entre Ancho y Alto) contra el largo de cada fila
   de la tabla. Se usa la fila cuyo largo esté MÁS CERCA, siempre que la diferencia sea de
   como máximo 50 cm (0,50 m) — así una medida que no está tal cual en el mantenedor igual
   toma el precio de la más parecida (ej: tabla tiene 13,50 x 9,00 → sirve para un pedido de
   13,00 x 9,00, porque hay 0,50 m de diferencia entre 13,50 y 13,00).
   Si ninguna fila queda dentro de esos 50 cm, no inventa nada: devuelve 0, editable a mano. */
const TOLERANCIA_MEDIDA=0.5;
function buscarPorMedidaTolerante(filas, campo, ancho, alto){
  if(!filas.length || !(ancho&&alto)) return 0;
  const L=Math.max(ancho,alto);
  let mejor=null, mejorDist=Infinity;
  filas.forEach(f=>{
    const dist=Math.abs(Math.max(f.ancho,f.alto)-L);
    if(dist<=TOLERANCIA_MEDIDA && dist<mejorDist){ mejor=f; mejorDist=dist; }
  });
  return mejor ? mejor[campo] : 0;
}
function armadoPorMedida(ancho, alto){
  return buscarPorMedidaTolerante(TABLA_ARMADO.filas||[], 'confeccion', ancho, alto);
}

function comprimirImagen(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=480, scale=Math.min(1, maxW/img.width);
      const w=Math.round(img.width*scale)||1, h=Math.round(img.height*scale)||1;
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.75));
    };
    img.onerror=()=>toast('No se pudo leer la imagen.','error');
    img.src=reader.result;
  };
  reader.onerror=()=>toast('No se pudo leer el archivo.','error');

}

/* Autoformato de texto: primera letra mayúscula, resto minúscula (y por palabra para nombres) */
function toSentenceCase(s){ s=s||''; return s.length? s.charAt(0).toUpperCase()+s.slice(1).toLowerCase() : s; }
function toTitleCase(s){ s=s||''; return s.toLowerCase().replace(/(^|[\s.-])([a-zà-öø-ÿñ])/g,(m,p1,p2)=>p1+p2.toUpperCase()); }
function autoCap(el,mode){
  if(!el) return;
  const pos=el.selectionStart, val=el.value;
  const out = mode==='title' ? toTitleCase(val) : toSentenceCase(val);
  if(out!==val){ el.value=out; if(pos!=null) el.setSelectionRange(pos,pos); }
}
function bindCostosForm(){
  const e1=$('#cfEmpresa'); if(e1) e1.addEventListener('input',()=>autoCap(e1,'title'));

  const e3=$('#cfDireccion'); if(e3) e3.addEventListener('input',()=>autoCap(e3,'sentence'));
  const e4=$('#cfMail'); if(e4) e4.addEventListener('input',()=>autoLower(e4));
  const e5=$('#cfRut'); if(e5) e5.addEventListener('input',()=>autoRut(e5));
  const e6=$('#cfTelefono'); if(e6) e6.addEventListener('input',()=>autoTelefono(e6));
}
function autoLower(el){
  const pos=el.selectionStart, val=el.value, out=val.toLowerCase();
  if(out!==val){ el.value=out; if(pos!=null) el.setSelectionRange(pos,pos); }
}
/* Antepone siempre un "+" al teléfono (ej: 56992542227 -> +56992542227) */
function formatTelefono(raw){
  let v=(raw||'').trim();
  if(!v) return '';
  v='+'+v.replace(/\+/g,'');
  return v;
}
function autoTelefono(el){
  const pos=el.selectionStart, val=el.value, out=formatTelefono(val);
  if(out!==val){ el.value=out; const nuevaPos=(pos!=null)?pos+(out.length-val.length):out.length; el.setSelectionRange(Math.max(nuevaPos,1),Math.max(nuevaPos,1)); }
}
/* Formatea RUT chileno con puntos de miles y guion: 777527959 -> 77.752.795-9 */
function formatRut(raw){
  let v=(raw||'').replace(/[^0-9kK]/g,'').toUpperCase();
  if(!v) return '';
  const dv=v.slice(-1), body=v.slice(0,-1);
  if(!body) return dv;
  return body.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dv;
}
function autoRut(el){
  const val=el.value, out=formatRut(val);
  if(out!==val){ el.value=out; el.setSelectionRange(out.length,out.length); }
}

/* ---------- Motor de costeo por ítem (materiales/procesos + flete + financiero/imprevisto + margen + IVA) ---------- */
const TIPOS_PRODUCTO=['Bandera','Bandera Intexa','Driza','Asta Madera','Asta Escritorio','Asta Bronce','Otros'];
const TIPOS_VAINA=['Vaina de Lona','Huincha de poliéster'];
const TIPOS_ACABADO=['Estrella','Aplicado','Sublimado','Confección'];
const MARGEN_ESCENARIOS=[0.15,0.20,0.25,0.30];
function itemNuevo(){

  };
}
/* Números en formato chileno: coma decimal (13,00 = 13 metros; 0,90 = 90 cm) */
function parseNumCL(val){
  if(val==null||val==='') return 0;
  if(typeof val==='number') return val;
  let s=String(val).trim();
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); // "1.234,50" -> "1234.50"
  const n=parseFloat(s); return isNaN(n)?0:n;
}
function formatNumCL(n, decimals){
  decimals = decimals==null?2:decimals;
  return (+n||0).toLocaleString('es-CL',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
/* Montos en pesos con puntos de miles, editables como texto: 85000 <-> "85.000" */
function formatMiles(n){ return Math.round(+n||0).toLocaleString('es-CL'); }
function parseMiles(str){ if(str==null) return 0; const n=parseInt(String(str).replace(/[^0-9-]/g,''),10); return isNaN(n)?0:n; }
/* Cantidad de tela: (Alto × Ancho / 1,4) × 1,2  ·  Crea (si aplica): tela / 12.
   La columna "Cantidad" se muestra redondeada a 1 decimal, pero el monto en $ siempre
   se calcula con el valor exacto (con todos los decimales), para no perder precisión en el costeo. */
function redondear1(n){ return Math.round((+n||0)*10)/10; }
function calcularTela(it){
  const alto=parseNumCL(it.alto), ancho=parseNumCL(it.ancho);
  const telaCantExacta = (alto&&ancho) ? ((alto*ancho)/1.4)*1.2 : 0;
  const telaCant = redondear1(telaCantExacta);
  const telaCosto = it.telaCosto!=null && it.telaCosto!=='' ? +it.telaCosto : 730;
  const telaSubtotal = telaCantExacta*telaCosto;
  const creaActiva = it.creaActiva===true;
  const creaCantExacta = creaActiva ? telaCantExacta/12 : 0;
  const creaCant = redondear1(creaCantExacta);
  const creaCosto = it.creaCosto!=null && it.creaCosto!=='' ? +it.creaCosto : 730;
  const creaSubtotal = creaCantExacta*creaCosto;
  return {telaCant,telaCantExacta,telaCosto,telaSubtotal,creaActiva,creaCant,creaCantExacta,creaCosto,creaSubtotal};
}
function fmtNum(n){ n=+n||0; return (Math.round(n*10000)/10000).toLocaleString('es-CL',{maximumFractionDigits:4}); }
/* Accesorios: Huincha de poliéster = Alto×2 + 0,10 m (10 cm) (solo si vaina = Huincha de poliéster)
   Argollas = tabla por medida (mantenedor) + extra editable, ambos solo aplican con Huincha de poliéster */
function calcularAccesorios(it, telaCalc){
  const esHuincha = it.tipoVaina==='Huincha de poliéster';
  const alto=parseNumCL(it.alto), ancho=parseNumCL(it.ancho);
  const huinchaCantExacta = esHuincha ? (alto*2+0.10) : 0;
  const huinchaCant = redondear1(huinchaCantExacta);
  const huinchaCosto = it.huinchaCosto!=null && it.huinchaCosto!=='' ? +it.huinchaCosto : 300;
  const huinchaSubtotal = huinchaCantExacta*huinchaCosto;
  const argollasBase = esHuincha ? argollasPorMedida(ancho,alto) : 0;
  const argollaExtra = +it.argollaExtra||0;
  const argollasCant = argollasBase+argollaExtra;
  const argollaCosto = it.argollaCosto!=null && it.argollaCosto!=='' ? +it.argollaCosto : 200;
  const argollaSubtotal = argollasCant*argollaCosto;
  const subtotalAccesorios = huinchaSubtotal+argollaSubtotal;
  return {esHuincha,huinchaCant,huinchaCantExacta,huinchaCosto,huinchaSubtotal,argollasBase,argollaExtra,argollasCant,argollaCosto,argollaSubtotal,subtotalAccesorios};
}
/* Confección:
   - Armado = tarifado por medida (basta que coincida el Largo). Si no hay ninguna coincidencia, queda en $0 editable.
   - Cortado = tarifado por medida (mismo criterio), tabla propia.
   - Festoneado = tarifado por medida (mismo criterio), tabla "Estrella" internamente. Siempre aplica;
     si Especificación="Aplicado", su costo por defecto es el mismo que el de Armado (no el tarifado).
   - Limpieza/Embolsado = % del Armado (por defecto 10%). Se recalcula solo apenas cambia el Armado.
   - Sublimado = monto fijo editable (por defecto $2.200). No aplica (queda en $0) si Especificación="Estrella".
   Todos los montos quedan editables en pesos por ítem, igual que Telas/Accesorios. */
function calcularConfeccion(it){
  const ancho=parseNumCL(it.ancho), alto=parseNumCL(it.alto);
  const armadoDefault = armadoPorMedida(ancho,alto);
  const armadoCosto = it.armadoCosto!=null && it.armadoCosto!=='' ? +it.armadoCosto : armadoDefault;
  const armadoSubtotal = armadoCosto;

  const cortadoDefault = cortadoPorMedida(ancho,alto);
  const cortadoCosto = it.cortadoCosto!=null && it.cortadoCosto!=='' ? +it.cortadoCosto : cortadoDefault;
  const cortadoSubtotal = cortadoCosto;

  const festoneadoAplica = true;
  const estrellaDefault = it.tipoAcabado==='Aplicado' ? armadoCosto : estrellaPorMedida(ancho,alto);
  const estrellaCosto = it.estrellaCosto!=null && it.estrellaCosto!=='' ? +it.estrellaCosto : estrellaDefault;
  const estrellaSubtotal = estrellaCosto;

  const limpiezaDefault = armadoCosto*CONFECCION_PCT.limpieza;
  const limpiezaCosto = it.limpiezaCosto!=null && it.limpiezaCosto!=='' ? +it.limpiezaCosto : limpiezaDefault;
  const limpiezaSubtotal = limpiezaCosto;

  const sublimadoAplica = it.tipoAcabado!=='Estrella';
  const sublimadoDefault = 2200;
  const sublimadoCosto = it.sublimadoCosto!=null && it.sublimadoCosto!=='' ? +it.sublimadoCosto : sublimadoDefault;
  const sublimadoSubtotal = sublimadoAplica ? sublimadoCosto : 0;

  const subtotalConfeccion = armadoSubtotal+cortadoSubtotal+estrellaSubtotal+limpiezaSubtotal+sublimadoSubtotal;
  return {armadoDefault,armadoCosto,armadoSubtotal,cortadoDefault,cortadoCosto,cortadoSubtotal,
    festoneadoAplica,estrellaDefault,estrellaCosto,estrellaSubtotal,
    limpiezaCosto,limpiezaSubtotal,
    sublimadoAplica,sublimadoCosto,sublimadoSubtotal,
    subtotalConfeccion};
}
/* Otros: Flete = % de todos los costos anteriores (Telas+Accesorios+Confección+líneas).
   Costo Finan/Impos/Imprevisto = % de esos mismos costos anteriores, SIN considerar el Flete. */
function calcularOtros(it, baseCostos){
  const fletePct = it.fletePct!=null && it.fletePct!=='' ? +it.fletePct : 0.10;
  const flete = baseCostos*fletePct;
  const finImpPct = it.finImpPct!=null && it.finImpPct!=='' ? +it.finImpPct : 0.06;
  const finImp = baseCostos*finImpPct;
  const subtotalOtros = flete+finImp;
  return {fletePct,flete,finImpPct,finImp,subtotalOtros};
}
function calcularItem(it){
  const t = calcularTela(it);
  const a = calcularAccesorios(it, t);
  const c = calcularConfeccion(it);
  const subtotalA = t.telaSubtotal + t.creaSubtotal + a.subtotalAccesorios + c.subtotalConfeccion;
  const o = calcularOtros(it, subtotalA);
  const subtotalB = o.subtotalOtros;
  const totalCosto = subtotalA+subtotalB;
  const margenMonto = totalCosto*(+it.margenPct||0);
  const precioUnitNeto = totalCosto+margenMonto;
  const cantidad = +it.cantidad||0;
  const totalNeto = precioUnitNeto*cantidad;
  const iva = totalNeto*IVA_PCT;
  const totalConIva = totalNeto+iva;
  return {...t,...a,...c,...o,subtotalA,subtotalB,totalCosto,margenMonto,precioUnitNeto,totalNeto,iva,totalConIva};
}

    return s; }, {neto:0,iva:0,conIva:0,costo:0,margen:0});
}

function bindDetalleCotizacion(){
  const wrap=$('#itemsCot'); if(!wrap) return;
  const recalcCard=recalcCardDetalle, recalcTotales=recalcTotalesDetalle;
  wrap.addEventListener('input', e=>{
    const card=e.target.closest('.item-card'); if(!card) return;
    recalcCard(card); recalcTotales();
  });
  wrap.addEventListener('change', e=>{
    const card=e.target.closest('.item-card'); if(!card) return;
    if(e.target.classList.contains('ci-tipovaina')||e.target.classList.contains('ci-tipoacabado')){
      const idx=[...wrap.children].indexOf(card);
      const it=leerItemDeCard(card);
      const div=document.createElement('div'); div.innerHTML=itemCardHTML(it, idx);
      wrap.replaceChild(div.firstElementChild, card);
      recalcTotales();
    }
    else if(e.target.classList.contains('foto-file')){
      const file=e.target.files[0]; if(!file) return;
      comprimirImagen(file, dataUrl=>{
        aplicarFotoACard(card, dataUrl);
        const tipo=card.querySelector('.ci-tipo').value.trim();
        if(tipo){ FOTOS.items.push({id:uid(),nombre:tipo,img:dataUrl}); saveFotos(); }
        toast('Foto agregada.');
      });
      e.target.value='';
    }
  });
  wrap.addEventListener('dragover', e=>{
    const dz=e.target.closest && e.target.closest('.foto-preview'); if(!dz) return;
    e.preventDefault();
    dz.classList.add('drag-over');
  });
  wrap.addEventListener('dragleave', e=>{
    const dz=e.target.closest && e.target.closest('.foto-preview'); if(!dz) return;
    dz.classList.remove('drag-over');
  });
  wrap.addEventListener('drop', e=>{
    const dz=e.target.closest && e.target.closest('.foto-preview'); if(!dz) return;
    e.preventDefault();
    dz.classList.remove('drag-over');
    const card=e.target.closest('.item-card'); if(!card) return;
    const file=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(!file){ return; }
    if(!file.type || !file.type.startsWith('image/')){ toast('Arrastra un archivo de imagen.','error'); return; }
    comprimirImagen(file, dataUrl=>{
      aplicarFotoACard(card, dataUrl);
      const tipo=card.querySelector('.ci-tipo').value.trim();
      if(tipo){ FOTOS.items.push({id:uid(),nombre:tipo,img:dataUrl}); saveFotos(); }
      toast('Foto agregada.');
    });
  });
  wrap.addEventListener('click', e=>{
    const card=e.target.closest('.item-card');
    const margenBtn=e.target.closest('.margen-esc[data-pct]');
    if(e.target.classList.contains('del-item')){ if(wrap.children.length>1){ card.remove(); recalcTotales(); } else toast('Debe quedar al menos un ítem.','error'); }
    else if(margenBtn){
      card.querySelector('.ci-margen').value=formatPct(+margenBtn.dataset.pct);
      recalcCard(card); recalcTotales();
    }
    else if(e.target.classList.contains('foto-subir')){ card.querySelector('.foto-file').click(); }
    else if(e.target.classList.contains('foto-buscar')){ abrirGaleriaFotos(card); }
    else if(e.target.classList.contains('foto-quitar')){ aplicarFotoACard(card, ''); }
  });
  wrap.addEventListener('focusout', e=>{
    const card=e.target.closest('.item-card'); if(!card) return;
    if(e.target.classList.contains('ci-ancho')||e.target.classList.contains('ci-alto')){
      const v=e.target.value.trim();
      e.target.value = v? formatNumCL(parseNumCL(v)) : '';
      // Armado y Cortado siempre siguen la medida más cercana al cambiar Ancho/Alto
      const ancho=parseNumCL(card.querySelector('.ci-ancho').value), alto=parseNumCL(card.querySelector('.ci-alto').value);
      const nuevoArmado=armadoPorMedida(ancho,alto);
      card.querySelector('.ci-armadocosto').value=formatMiles(nuevoArmado);
      card.querySelector('.ci-cortadocosto').value=formatMiles(cortadoPorMedida(ancho,alto));
      const tipoAcabadoActual=card.querySelector('.ci-tipoacabado').value;
      card.querySelector('.ci-estrellacosto').value=formatMiles(tipoAcabadoActual==='Aplicado' ? nuevoArmado : estrellaPorMedida(ancho,alto));
      // Limpieza/Embolsado siempre es el % (por defecto 20%) del Armado, altiro
      card.querySelector('.ci-limpiezacosto').value=formatMiles(nuevoArmado*CONFECCION_PCT.limpieza);
      recalcCard(card); recalcTotales();
    }
    else if(e.target.classList.contains('ci-armadocosto')){
      e.target.value=formatMiles(parseMiles(e.target.value));
      const nuevoArmado=parseMiles(e.target.value);
      card.querySelector('.ci-limpiezacosto').value=formatMiles(nuevoArmado*CONFECCION_PCT.limpieza);
      recalcCard(card); recalcTotales();
    }
    else if(e.target.classList.contains('ci-cortadocosto')
      ||e.target.classList.contains('ci-estrellacosto')
      ||e.target.classList.contains('ci-limpiezacosto')
      ||e.target.classList.contains('ci-sublimadocosto')){
      e.target.value=formatMiles(parseMiles(e.target.value));
      recalcCard(card); recalcTotales();
    }
  });
  const addBtn=$('#addItemCot');
  if(addBtn) addBtn.onclick=()=>{
    const div=document.createElement('div');
    div.innerHTML=itemCardHTML(itemNuevo(), wrap.children.length);
    wrap.appendChild(div.firstElementChild);
  };
  const buscarInput=$('#buscarAnteriorInput');
  if(buscarInput) buscarInput.addEventListener('keydown', e=>{ if(e.key==='Enter') buscarItemsAnteriores(); });
}

/* ============================ MERCADO PÚBLICO ============================ */
const KEY_MERCADO='taller_gary_mercado_v1';
function loadMercado(){
  try{ const raw=localStorage.getItem(KEY_MERCADO); if(raw) return JSON.parse(raw); }catch(e){ console.error(e); }
  return { ticket:'', palabras:'bandera, banderas, pabellón, estandarte, gallardete, insignia, sublimación, corbatín',
    decisiones:{} /* codigo -> 'interes' | 'descartada' */ };
}
function saveMercado(){ localStorage.setItem(KEY_MERCADO, JSON.stringify(MERCADO)); }
let MERCADO = loadMercado();
let mercadoResultados=[];
let mercadoBuscando=false;

function ddmmyyyy(iso){ const [y,m,d]=iso.split('-'); return d+m+y; }
function jsonpFetch(url, timeoutMs){
  timeoutMs = timeoutMs||18000;
  return new Promise((resolve,reject)=>{
    const cbName='jsonpCb_'+Math.random().toString(36).slice(2);
    let done=false;
    const script=document.createElement('script');
    const timer=setTimeout(()=>{ if(!done){ done=true; cleanup(); reject(new Error('Tiempo de espera agotado. Revisa el ticket o intenta de nuevo.')); } }, timeoutMs);
    function cleanup(){ clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName]=(data)=>{ if(done) return; done=true; cleanup(); resolve(data); };
    script.onerror=()=>{ if(done) return; done=true; cleanup(); reject(new Error('No se pudo conectar con la API de Mercado Público.')); };
    script.src=url+(url.includes('?')?'&':'?')+'callback='+cbName;
    document.body.appendChild(script);
  });
}
function guardarTicketMercado(){
  const v=$('#mkTicket').value.trim();
  if(!v){ toast('Ingresa un ticket válido.','error'); return; }
  MERCADO.ticket=v; saveMercado(); render(); toast('Ticket guardado.');
}
function cambiarTicketMercado(){ MERCADO.ticket=''; saveMercado(); render(); }
async function buscarLicitaciones(){
  if(!MERCADO.ticket){ toast('Primero guarda tu ticket.','error'); return; }
  const fecha=$('#mkFecha').value; if(!fecha){ toast('Elige una fecha.','error'); return; }
  mercadoBuscando=true; render();
  try{
    const url=`https://api.mercadopublico.cl/servicios/v1/publico/licitaciones.jsonp?fecha=${ddmmyyyy(fecha)}&ticket=${encodeURIComponent(MERCADO.ticket)}`;
    const data=await jsonpFetch(url);
    const lista = data && (data.Listado||data.listado||data.Lista) || [];
    mercadoResultados = lista.map(x=>({
      codigo: x.CodigoExterno||x.codigoExterno||x.Codigo||'',
      nombre: x.Nombre||x.nombre||'(sin nombre)',
      organismo: x.NombreOrganismo||x.Organismo||x.nombreOrganismo||'',
      estado: x.Estado||x.estado||x.CodigoEstado||'',
      cierre: x.FechaCierre||x.fechaCierre||'',
    }));
    saveMercado();
    toast(`${mercadoResultados.length} licitaciones encontradas para el ${fmtDateCL(fecha)}.`);
  }catch(e){
    console.error(e);
    toast('Error: '+e.message,'error');
    mercadoResultados=[];
  }
  mercadoBuscando=false; render();
}
function filtrarLicitaciones(){
  const palabras=(MERCADO.palabras||'').split(',').map(p=>normalizarNombre(p.trim())).filter(Boolean);
  if(!palabras.length) return mercadoResultados;
  return mercadoResultados.filter(r=>{
    const hay=normalizarNombre(r.nombre)+' '+normalizarNombre(r.organismo);
    return palabras.some(p=>hay.includes(p));
  });
}
function guardarPalabrasMercado(){
  MERCADO.palabras=$('#mkPalabras').value; saveMercado(); render();
}
function marcarLicitacion(codigo, estado){
  MERCADO.decisiones[codigo]=estado; saveMercado(); render();
}

function renderModule(m){
  if(m.id==='produccion'){ return renderProduccion(m); }
  if(m.id==='costos'){ return renderCostos(m); }
  if(m.id==='mercado'){ return renderMercado(m); }
  return `
    <div class="backlink" onclick="go('inicio')">← Volver al inicio</div>
    <div class="page-head">
      <div class="icon">${m.icon}</div>
      <div><h1>${m.title} ${badge(m.status)}</h1>
        <div class="sub">${m.desc}</div>
        ${m.conn?`<div class="conn">${m.conn}</div>`:''}
      </div>
    </div>
    <div class="construction">
      <div class="big">${m.status==='ready'?'✅':'🚧'}</div>
      <div><b>${m.status==='ready'?'Módulo listo para integrar':'Módulo por desarrollar'}</b>
        <p>${m.intro}</p></div>
    </div>
    <div class="panel">
      <h2>Qué tendrá este módulo</h2>
      ${m.feats.map(f=>`<div class="feat"><span class="dot">◆</span>
        <div><b>${f[0]}</b><span>${f[1]}</span></div></div>`).join('')}
    </div>
    <div class="panel" style="text-align:center;color:var(--muted)">
      Cuando decidamos empezar por este módulo, aquí construimos la funcionalidad.
    </div>`;
}

function seedProduccion(){ return {seq:1, rows:[], removedSeeds:[]}; }
function normalizarProduccion(data){
  data.rows.forEach(r=>{
    if(r.aplicada==null) r.aplicada=false;
    if(r.anexos===undefined){
      if(r.ot==='1480') r.anexos=[{id:'ot-1480', nombre:'OT 1480.xlsx', tipo:'hoja', hoja:PXSHEET_1480}];
      else if(r.ot==='1474') r.anexos=[{id:'ot-1474', nombre:'OT 1474.xlsx', tipo:'hoja', hoja:PXSHEET_1474}];
      else r.anexos=[];
    }
    if(r.ot==='1480'){ r.fCom='2026-08-14'; r.obs=''; }
    delete r.otDoc; delete r.archivoImg;
  });
}
function loadProduccion(){
  let data;
  try{ const raw=localStorage.getItem(KEY_PRODUCCION); data = raw? JSON.parse(raw) : seedProduccion(); }
  catch(e){ console.error(e); data=seedProduccion(); }
  data.rows = data.rows||[]; data.removedSeeds = data.removedSeeds||[];
  const existentes=new Set(data.rows.map(r=>r.uid));
  SEED_ROWS.forEach(sr=>{
    if(!existentes.has(sr.uid) && !data.removedSeeds.includes(sr.uid)) data.rows.push({...sr});
  });
  normalizarProduccion(data);
  return data;
}
/* ---------- Sincronización real entre dispositivos (Google Sheets / Apps Script) ----------
   El panel guarda y lee los datos de Producción desde un Google Apps Script propio de Nico
   (un archivo en su Google Drive). Funciona en cualquier hosting normal (GitHub Pages, etc.);
   NO funciona dentro de un Artifact de Claude porque esa plataforma bloquea las conexiones
   salientes a servicios externos (CSP) — por eso este archivo va publicado en GitHub Pages. */
const PROD_SYNC_URL='https://script.google.com/macros/s/AKfycbwAACl5LecQlRplOQqxINxjcPsoppWspspEyBN3xmsr2o7lrzMFhc6-1m-qydVLUrgP/exec';
let prodSyncTimer=null;
let prodSyncPoll=null;
/* 'cargando' | 'nube' | 'nube-error' */
let prodSyncEstado='cargando';
let prodSyncDetalle='';
function prodActualizarPildoraSync(){
  const el=document.getElementById('prodSyncPill');
  if(!el) return;
  const txt={ cargando:'☁️ Conectando…', nube:'☁️ Sincronizado', 'nube-error':'⚠️ Error: '+prodSyncDetalle }[prodSyncEstado];
  el.textContent=txt;
  el.className='pill prod-cloud-pill '+prodSyncEstado;
}
function saveProduccion(){
  localStorage.setItem(KEY_PRODUCCION, JSON.stringify(PRODUCCION));
  clearTimeout(prodSyncTimer);
  prodSyncTimer=setTimeout(prodEnviarNube, 900);
}
function prodEnviarNube(){
  prodSyncTimer=null; // el envío ya está en curso; deja de bloquear las lecturas
  fetch(PROD_SYNC_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(PRODUCCION),
  }).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    prodSyncEstado='nube'; prodSyncDetalle=''; prodActualizarPildoraSync();
  }).catch(e=>{
    console.error('No se pudo guardar en la nube:', e);
    prodSyncEstado='nube-error'; prodSyncDetalle=String(e&&e.message||e); prodActualizarPildoraSync();
    toast('No se pudo guardar en la nube.', 'error');
  });
}
async function prodSincronizarAhora(silencioso){
  if(prodSyncTimer){
    // Hay un cambio local recién hecho, todavía por subir — no lo pisemos trayendo una
    // lectura vieja de la nube. Se reintenta solo apenas termine de subir (ver prodEnviarNube).
    if(!silencioso) toast('Hay un cambio sin guardar todavía, espera un segundo…');
    return;
  }
  try{
    const res=await fetch(PROD_SYNC_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const remoto=await res.json();
    if(prodSyncTimer) return; // mientras esperábamos la respuesta, se hizo una edición local — no la pisemos
    const n=(remoto.rows||[]).length;
    const huboNuevas=prodFusionarRemoto(remoto);
    prodSyncEstado='nube'; prodSyncDetalle=''; prodActualizarPildoraSync();
    if(current==='produccion') render();
    if(huboNuevas) saveProduccion(); // solo si el merge trajo filas nuevas (ej. una OT que agregué yo) que aún no están en la nube
    else localStorage.setItem(KEY_PRODUCCION, JSON.stringify(PRODUCCION));
    if(!silencioso) toast('Sincronizado: '+n+' fila(s) desde la nube.');
  }catch(e){
    console.error('No se pudo leer desde la nube:', e);
    prodSyncEstado='nube-error'; prodSyncDetalle=String(e&&e.message||e); prodActualizarPildoraSync();
    if(!silencioso) toast('No se pudo conectar a la nube.','error');
  }
}
function prodFusionarRemoto(remoto){
  if(!remoto || !Array.isArray(remoto.rows)) return false;
  PRODUCCION={
    seq: Math.max(PRODUCCION.seq||1, remoto.seq||1),
    rows: remoto.rows,
    removedSeeds: remoto.removedSeeds || PRODUCCION.removedSeeds || [],
  };
  const existentes=new Set(PRODUCCION.rows.map(r=>r.uid));
  let huboNuevas=false;
  SEED_ROWS.forEach(sr=>{
    if(!existentes.has(sr.uid) && !PRODUCCION.removedSeeds.includes(sr.uid)){ PRODUCCION.rows.push({...sr}); huboNuevas=true; }
  });
  normalizarProduccion(PRODUCCION);
  localStorage.setItem(KEY_PRODUCCION, JSON.stringify(PRODUCCION));
  return huboNuevas;
}
if(!prodSyncPoll) prodSyncPoll=setInterval(()=>{ if(current==='produccion') prodSincronizarAhora(true); }, 20000);
let PRODUCCION = loadProduccion();
prodSincronizarAhora(true);
saveProduccion();
let prodTab='vigentes';        // 'vigentes' | 'entregadas' | 'todo'
let prodBusqueda='';
let prodStatFiltro=null;       // 'atrasados' | 'aldia' | 'aplicado' | 'sublim' | null
let prodSeleccion=new Set();

function diasDif(fCom){
  if(!fCom) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const f=new Date(fCom+'T00:00:00');
  if(isNaN(f)) return null;
  return Math.round((f-hoy)/86400000);
}
function pct(n,d){ return d? Math.round(n/d*100) : 0; }

function prodCalcStats(){
  const vig=PRODUCCION.rows.filter(r=>!r.entregada);
  const atrasados=vig.filter(r=>{ const d=diasDif(r.fCom); return d!=null && d<0; }).length;
  const aldia=vig.length-atrasados;
  const aplicado=vig.filter(r=>r.aplicada).length;
  const sublim=vig.filter(r=>r.sublimacion).length;
  const entregadas=PRODUCCION.rows.length-vig.length;
  return {total:PRODUCCION.rows.length, vig:vig.length, atrasados, aldia, aplicado, sublim, entregadas};
}
function prodStatsHtml(){
  const s=prodCalcStats(); const base=s.vig||1;
  return `<div class="prod-stats">
    <div class="prod-stat ${!prodStatFiltro?'active':''}" onclick="prodFiltrarStat(null)"><b>${s.total}</b><span>Filas totales</span></div>
    <div class="prod-stat warn ${prodStatFiltro==='atrasados'?'active':''}" onclick="prodFiltrarStat('atrasados')"><b>${s.atrasados}</b><span>Atrasados · ${pct(s.atrasados,base)}%</span></div>
    <div class="prod-stat ${prodStatFiltro==='aldia'?'active':''}" onclick="prodFiltrarStat('aldia')"><b>${s.aldia}</b><span>Al día · ${pct(s.aldia,base)}%</span></div>
    <div class="prod-stat ${prodStatFiltro==='aplicado'?'active':''}" onclick="prodFiltrarStat('aplicado')"><b>${s.aplicado}</b><span>Aplicado · ${pct(s.aplicado,base)}%</span></div>
    <div class="prod-stat ${prodStatFiltro==='sublim'?'active':''}" onclick="prodFiltrarStat('sublim')"><b>${s.sublim}</b><span>Sublim. · ${pct(s.sublim,base)}%</span></div>
    <div class="prod-stat"><b>${s.entregadas}</b><span>Entregadas</span></div>
  </div>`;
}
function prodRowsVista(){
  let rows=PRODUCCION.rows;
  if(prodTab==='vigentes') rows=rows.filter(r=>!r.entregada);
  else if(prodTab==='entregadas') rows=rows.filter(r=>r.entregada);
  if(prodStatFiltro==='atrasados') rows=rows.filter(r=>!r.entregada && diasDif(r.fCom)!=null && diasDif(r.fCom)<0);
  if(prodStatFiltro==='aldia') rows=rows.filter(r=>!r.entregada && diasDif(r.fCom)!=null && diasDif(r.fCom)>=0);
  if(prodStatFiltro==='aplicado') rows=rows.filter(r=>!r.entregada && r.aplicada);
  if(prodStatFiltro==='sublim') rows=rows.filter(r=>!r.entregada && r.sublimacion);
  const q=(prodBusqueda||'').trim().toLowerCase();
  if(q) rows=rows.filter(r=>[r.ot,r.cliente,r.comuna,r.producto,r.etapa,r.tela,r.obs].some(v=>(''+(v||'')).toLowerCase().includes(q)));
  return rows;
}
function prodEmptyRowHtml(){
  return `<tr><td colspan="17"><div class="prod-empty">Sin filas para mostrar. Usa "+ Nueva fila" o "📥 Importar filas".</div></td></tr>`;
}
function prodThumbHtml(r){
  if(r.foto) return `<div class="prod-thumb-cell" onclick="prodAbrirFoto('${r.uid}')"><img src="${r.foto}"></div>`;
  return `<div class="prod-thumb-cell" onclick="prodSubirFoto('${r.uid}')"><span>＋</span></div>`;
}
function prodAnexoHtml(r){
  const n=(r.anexos||[]).length;
  return `<button class="prod-mini ghost anexo" title="Anexos" onclick="prodAbrirAnexo('${r.uid}')">📎${n?` ${n}`:''}</button>`;
}
function prodFilaHtml(r, sep){
  const d=diasDif(r.fCom);
  const difHtml = d==null? '<span class="muted">—</span>' : `<span class="prod-dif ${d<0?'late':'ok'}">${d}</span>`;
  const sel=prodSeleccion.has(r.uid);
  return `<tr class="${r.entregada?'entregada':''} ${sel?'sel':''} ${sep?'grupo-sep':''}">
    <td><input type="checkbox" ${sel?'checked':''} onchange="prodToggleSeleccion('${r.uid}')"></td>
    <td><input value="${esc(r.ot)}" oninput="prodInput(this,'${r.uid}','ot')" style="width:64px"></td>
    <td><input value="${esc(r.cliente)}" oninput="prodInput(this,'${r.uid}','cliente')" style="width:120px"></td>
    <td><input value="${esc(r.comuna)}" oninput="prodInput(this,'${r.uid}','comuna')" style="width:100px"></td>
    <td><input type="date" value="${esc(r.fCom)}" oninput="prodInputFecha(this,'${r.uid}')" style="width:132px"></td>
    <td id="dif-${r.uid}">${difHtml}</td>
    <td>${prodThumbHtml(r)}</td>
    <td><input value="${esc(r.producto)}" oninput="prodInput(this,'${r.uid}','producto')" style="width:160px"></td>
    <td><input value="${esc(r.medida)}" oninput="prodInput(this,'${r.uid}','medida')" style="width:90px"></td>
    <td><input value="${esc(r.tela)}" oninput="prodInput(this,'${r.uid}','tela')" style="width:90px"></td>
    <td class="num"><input value="${esc(r.cant)}" oninput="prodInput(this,'${r.uid}','cant')" style="width:46px"></td>
    <td class="tiny"><button class="prod-toggle-mini ${r.sublimacion?'on':''}" title="Subli" onclick="prodToggleFlag('${r.uid}','sublimacion')">${r.sublimacion?'✓':''}</button></td>
    <td class="tiny"><button class="prod-toggle-mini ${r.aplicada?'on':''}" title="Apli" onclick="prodToggleFlag('${r.uid}','aplicada')">${r.aplicada?'✓':''}</button></td>
    <td><input value="${esc(r.obs)}" oninput="prodInput(this,'${r.uid}','obs')" style="width:150px"></td>
    <td><input value="${esc(r.etapa)}" oninput="prodInput(this,'${r.uid}','etapa')" style="width:130px" placeholder="Status"></td>
    <td>${prodAnexoHtml(r)}</td>
    <td><div class="prod-row-actions">
      <button class="prod-mini ok" title="${r.entregada?'Marcar vigente':'Marcar entregada'}" onclick="prodToggleEntregada('${r.uid}')">${r.entregada?'↩':'✓'}</button>
      <button class="prod-mini del" title="Eliminar fila" onclick="prodEliminarFila('${r.uid}')">🗑</button>
    </div></td>
  </tr>`;
}
function prodFilasHtml(rows){
  return rows.map((r,i)=>prodFilaHtml(r, i>0 && rows[i-1].ot!==r.ot)).join('');
}
function renderProduccion(m){
  const rows=prodRowsVista();
  return `
    <div class="backlink" onclick="go('inicio')">← Volver al inicio</div>
    <div class="prod-head">
      <div><h1>${m.icon} ${m.title}</h1><div class="sub">${m.desc}</div>
        <span id="prodSyncPill" class="pill prod-cloud-pill" onclick="prodSincronizarAhora(false)" title="Tocar para sincronizar ahora"></span></div>
      <div class="row" style="gap:8px">
        <button class="btn ghost sm" onclick="prodAbrirImportar()">📥 Importar filas</button>
        <button class="btn ghost sm" onclick="backupProduccion()">⬇ Respaldo</button>
        <label class="btn ghost sm" style="cursor:pointer">⬆ Restaurar<input type="file" accept="application/json" style="display:none" onchange="restoreProduccionFile(this)"></label>
        <button class="btn sm" onclick="prodNuevaFila()">+ Nueva fila</button>
      </div>
    </div>

    ${prodStatsHtml()}

    <div class="prod-toolbar">
      <input class="search" type="text" placeholder="Buscar OT, cliente, comuna, producto, etapa…" value="${esc(prodBusqueda)}" oninput="prodBuscar(this.value)">
      <div class="prod-tabs">
        <button class="${prodTab==='vigentes'?'active':''}" onclick="prodCambiarTab('vigentes')">Vigentes</button>
        <button class="${prodTab==='entregadas'?'active':''}" onclick="prodCambiarTab('entregadas')">Entregadas</button>
        <button class="${prodTab==='todo'?'active':''}" onclick="prodCambiarTab('todo')">Todo</button>
      </div>
    </div>

    ${prodSeleccion.size? `
    <div class="prod-bulkbar">
      <b>${prodSeleccion.size} seleccionada(s)</b>
      <button class="btn ok sm" onclick="prodMarcarSeleccion(true)">✓ Marcar entregada</button>
      <button class="btn ghost sm" onclick="prodMarcarSeleccion(false)">↩ Marcar vigente</button>
      <button class="btn danger sm" onclick="prodEliminarSeleccion()">🗑 Eliminar</button>
      <button class="btn ghost sm" onclick="prodLimpiarSeleccion()">Cancelar</button>
    </div>`:''}

    <div class="prod-table-wrap">
      <table class="prod-table">
        <thead><tr>
          <th style="width:26px"></th>
          <th>ID</th><th>Cliente</th><th>Comuna</th><th>F. Comp.</th><th>Dif</th><th>Foto</th>
          <th>Producto</th><th>Medida</th><th>Tela</th><th>Cant</th><th class="tiny">Subli</th><th class="tiny">Apli</th><th>Obs</th><th>Status</th><th>Anexo</th><th></th>
        </tr></thead>
        <tbody>${rows.length? prodFilasHtml(rows) : prodEmptyRowHtml()}</tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" onclick="prodNuevaFila()">+ Agregar fila</button></div>
  `;
}
function bindProduccion(){ prodActualizarPildoraSync(); }

function prodInput(el, uid, field){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
  r[field]=el.value; saveProduccion();
}
function prodInputFecha(el, uid){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
  r.fCom=el.value; saveProduccion();
  const d=diasDif(r.fCom);
  const celda=document.getElementById('dif-'+uid);
  if(celda) celda.innerHTML = d==null? '<span class="muted">—</span>' : `<span class="prod-dif ${d<0?'late':'ok'}">${d}</span>`;
  const box=document.querySelector('.prod-stats');
  if(box) box.outerHTML=prodStatsHtml();
}
function prodBuscar(v){
  prodBusqueda=v;
  const tbody=document.querySelector('.prod-table tbody');
  if(!tbody) return;
  const rows=prodRowsVista();
  tbody.innerHTML = rows.length? prodFilasHtml(rows) : prodEmptyRowHtml();
}
function prodCambiarTab(t){ prodTab=t; render(); }
function prodFiltrarStat(k){ prodStatFiltro=(prodStatFiltro===k? null : k); render(); }
function prodToggleFlag(uid, campo){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
  r[campo]=!r[campo]; saveProduccion(); render();
}
function prodToggleEntregada(uid){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
  r.entregada=!r.entregada; saveProduccion(); render();
  toast(r.entregada? 'Marcada como entregada.' : 'Marcada como vigente.');
}
function prodToggleSeleccion(uid){
  if(prodSeleccion.has(uid)) prodSeleccion.delete(uid); else prodSeleccion.add(uid);
  render();
}
function prodLimpiarSeleccion(){ prodSeleccion.clear(); render(); }
function prodMarcarSeleccion(entregada){
  PRODUCCION.rows.forEach(r=>{ if(prodSeleccion.has(r.uid)) r.entregada=entregada; });
  saveProduccion(); prodSeleccion.clear(); render();
  toast(entregada? 'Filas marcadas como entregadas.' : 'Filas marcadas como vigentes.');
}
function prodEliminarSeleccion(){
  const n=prodSeleccion.size;
  confirmDialog(`¿Eliminar ${n} fila(s) seleccionada(s)?`, ()=>{
    prodSeleccion.forEach(uid=>{
      if(uid.indexOf('seed-')===0 && !PRODUCCION.removedSeeds.includes(uid)) PRODUCCION.removedSeeds.push(uid);
    });
    PRODUCCION.rows=PRODUCCION.rows.filter(r=>!prodSeleccion.has(r.uid));
    prodSeleccion.clear(); saveProduccion(); render(); toast('Filas eliminadas.');
  });
}
function prodNuevaFila(){
  PRODUCCION.rows.push({
    uid:'r'+(PRODUCCION.seq++), ot:'', cliente:'', comuna:'', fCom:'', foto:'',
    producto:'', medida:'', tela:'', cant:'', obs:'', etapa:'',
    sinOC:false, sublimacion:false, aplicada:false, entregada:false, anexos:[],
  });
  saveProduccion(); render();
}
function prodEliminarFila(uid){
  confirmDialog('¿Eliminar esta fila de producción?', ()=>{
    PRODUCCION.rows=PRODUCCION.rows.filter(r=>r.uid!==uid);
    if(uid.indexOf('seed-')===0 && !PRODUCCION.removedSeeds.includes(uid)) PRODUCCION.removedSeeds.push(uid);
    prodSeleccion.delete(uid); saveProduccion(); render(); toast('Fila eliminada.');
  });
}
function prodSubirFoto(uid){
  const input=document.createElement('input'); input.type='file'; input.accept='image/*';
  input.onchange=()=>{
    const f=input.files[0]; if(!f) return;
    comprimirImagen(f, dataUrl=>{
      const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
      r.foto=dataUrl; saveProduccion(); render();
    });
  };
  input.click();
}
function prodAbrirFoto(uid){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r || !r.foto) return;
  const bg=document.createElement('div'); bg.className='prod-lightbox';
  bg.innerHTML=`<div style="text-align:center">
    <img src="${r.foto}">
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn ghost sm" id="pxReemplazar">Reemplazar</button>
      <button class="btn danger sm" id="pxQuitar">Quitar foto</button>
      <button class="btn sm" id="pxCerrar">Cerrar</button>
    </div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#pxCerrar').onclick=()=>bg.remove();
  bg.querySelector('#pxReemplazar').onclick=()=>{ bg.remove(); prodSubirFoto(uid); };
  bg.querySelector('#pxQuitar').onclick=()=>{ r.foto=''; saveProduccion(); bg.remove(); render(); };
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
}
/* ---------- Anexos: lista por fila → visualizador de solo lectura (nunca edición) ---------- */
function prodIconoAnexo(a){ return a.tipo==='hoja'?'📊':(a.tipo==='pdf'?'📄':'🖼️'); }
function prodAbrirAnexo(uid){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
  const anexos=r.anexos||[];
  const bg=document.createElement('div'); bg.className='confirm-bg';
  bg.innerHTML=`<div class="confirm-box anexo-lista">
    <div class="ot-doc-head"><b>Anexos</b><button class="btn ghost sm" id="alCerrar">Cerrar</button></div>
    <div id="alItems">${anexos.length? anexos.map((a,i)=>`
      <div class="anexo-item">
        <div class="anexo-item-info" onclick="prodVerAnexo('${uid}',${i})"><span class="anexo-ico">${prodIconoAnexo(a)}</span>${esc(a.nombre)}</div>
        <button class="prod-mini del" title="Quitar anexo" onclick="prodQuitarAnexo('${uid}',${i})">🗑</button>
      </div>`).join('') : `<div class="muted" style="padding:14px 2px;font-size:13px">Sin anexos todavía.</div>`}</div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn ghost sm" id="alAgregar">＋ Agregar anexo (foto o PDF)</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#alCerrar').onclick=()=>bg.remove();
  bg.querySelector('#alAgregar').onclick=()=>{ bg.remove(); prodSubirAnexo(uid); };
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
}
function prodQuitarAnexo(uid, idx){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r || !r.anexos) return;
  confirmDialog('¿Quitar este anexo?', ()=>{
    r.anexos.splice(idx,1); saveProduccion();
    document.querySelector('.confirm-bg')?.remove();
    prodAbrirAnexo(uid);
  });
}
function prodVerAnexo(uid, idx){
  const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
  const a=(r.anexos||[])[idx]; if(!a) return;
  document.querySelector('.confirm-bg')?.remove();
  if(a.tipo==='hoja'){
    const bg=document.createElement('div'); bg.className='confirm-bg';
    bg.innerHTML=`<div class="confirm-box wide hoja-box">
      <div class="ot-doc-head"><b>${esc(a.nombre)}</b><button class="btn ghost sm" id="hvCerrar">Cerrar</button></div>
      <div class="hoja-scroll">${prodHojaHtml(a.hoja)}</div>
    </div>`;
    document.body.appendChild(bg);
    bg.querySelector('#hvCerrar').onclick=()=>bg.remove();
    bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
    return;
  }
  const bg=document.createElement('div'); bg.className='prod-lightbox';
  bg.innerHTML = a.tipo==='pdf'
    ? `<div style="width:92vw;height:88vh;background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column">
        <iframe src="${a.dataUrl}" style="flex:1;border:0;width:100%"></iframe>
        <div class="row" style="justify-content:center;padding:10px"><button class="btn sm" id="avCerrar">Cerrar</button></div>
      </div>`
    : `<div style="text-align:center"><img src="${a.dataUrl}">
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm" id="avCerrar">Cerrar</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#avCerrar').onclick=()=>bg.remove();
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
}
/* Réplica de una planilla (grilla + celdas combinadas) a partir de los datos extraídos del xlsx original. */
/* Réplica pixel a pixel de la planilla original (texto posicionado exactamente donde estaba en el
   Excel, más las imágenes incrustadas — banderas, logos, etc. — extraídas del archivo real). */
function prodHojaHtml(sheet){
  let html=`<div class="hoja-lienzo" style="width:${sheet.w}px;height:${sheet.h}px">`;
  (sheet.cells||[]).forEach(c=>{
    const justify = c.a==='center'?'center':(c.a==='right'?'flex-end':'flex-start');
    html+=`<div class="hoja-celda" style="left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;font-size:${c.s}px;font-weight:${c.b?700:400};justify-content:${justify}">${esc(c.t)}</div>`;
  });
  (sheet.images||[]).forEach(im=>{
    html+=`<img class="hoja-img" style="left:${im.x}px;top:${im.y}px;width:${im.w}px;height:${im.h}px" src="${im.src}">`;
  });
  return html+'</div>';
}
function comprimirAnexoImagen(file, cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=1100, scale=Math.min(1, maxW/img.width);
      const w=Math.round(img.width*scale)||1, h=Math.round(img.height*scale)||1;
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.85));
    };
    img.onerror=()=>toast('No se pudo leer la imagen.','error');
    img.src=reader.result;
  };
  reader.onerror=()=>toast('No se pudo leer el archivo.','error');
  reader.readAsDataURL(file);
}
function prodSubirAnexo(uid){
  const input=document.createElement('input'); input.type='file'; input.accept='image/*,application/pdf';
  input.onchange=()=>{
    const f=input.files[0]; if(!f) return;
    const r=PRODUCCION.rows.find(x=>x.uid===uid); if(!r) return;
    if(!r.anexos) r.anexos=[];
    if(f.type==='application/pdf'){
      if(f.size>4*1024*1024){ toast('El PDF es muy pesado (máx. 4MB).','error'); return; }
      const reader=new FileReader();
      reader.onload=()=>{
        r.anexos.push({id:'a'+Date.now(), nombre:f.name||'Anexo.pdf', tipo:'pdf', dataUrl:reader.result});
        saveProduccion(); render(); toast('Anexo agregado.');
      };
      reader.readAsDataURL(f);
    } else {
      comprimirAnexoImagen(f, dataUrl=>{
        r.anexos.push({id:'a'+Date.now(), nombre:f.name||'Foto', tipo:'imagen', dataUrl});
        saveProduccion(); render(); toast('Anexo agregado.');
      });
    }
  };
  input.click();
}
function prodAbrirImportar(){
  const bg=document.createElement('div'); bg.className='confirm-bg';
  bg.innerHTML=`<div class="confirm-box wide prod-import">
    <h2 style="margin:0 0 6px;font-family:Georgia,serif;font-size:16px">Importar filas</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 10px;line-height:1.5">Pega aquí el JSON que te entregue el asistente a partir de una orden de trabajo (foto/PDF), o escríbelo tú mismo. Es un arreglo de objetos con los campos: ot, cliente, comuna, fCom (AAAA-MM-DD), producto, medida, tela, cant, obs, etapa.</p>
    <textarea id="prodImportTxt" placeholder='[{"ot":"1448","cliente":"ATF 60 Lientur","comuna":"Punta Arenas","fCom":"2026-07-31","producto":"Mantel de granite blanco","medida":"3,40 X 1,50","tela":"Granite","cant":3,"obs":"Doble costura fina y planchado","etapa":"Cortar"}]'></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn ghost sm" id="prodImpCancelar">Cancelar</button>
      <button class="btn sm" id="prodImpConfirmar">Agregar filas</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#prodImpCancelar').onclick=()=>bg.remove();
  bg.querySelector('#prodImpConfirmar').onclick=()=>prodImportar(bg);
  bg.addEventListener('click', e=>{ if(e.target===bg) bg.remove(); });
}
function prodImportar(bg){
  const txt=bg.querySelector('#prodImportTxt').value.trim();
  if(!txt){ toast('Pega algo primero.','error'); return; }
  let data;
  try{ data=JSON.parse(txt); }catch(e){ toast('JSON inválido.','error'); return; }
  if(!Array.isArray(data)){ toast('Debe ser un arreglo [ ... ].','error'); return; }
  let n=0;
  data.forEach(d=>{
    if(!d || typeof d!=='object') return;
    PRODUCCION.rows.push({
      uid:'r'+(PRODUCCION.seq++),
      ot:d.ot||'', cliente:d.cliente||'', comuna:d.comuna||'', fCom:d.fCom||'',
      foto:d.foto||'', producto:d.producto||'', medida:d.medida||'', tela:d.tela||'',
      cant:(d.cant!=null?d.cant:''), obs:d.obs||'', etapa:d.etapa||'',
      sinOC:!!d.sinOC, sublimacion:!!d.sublimacion, aplicada:!!d.aplicada, entregada:!!d.entregada, anexos:[],
    });
    n++;
  });
  saveProduccion(); bg.remove(); render();
  toast(n+' fila(s) importada(s).');
}
function backupProduccion(){
  const blob=new Blob([JSON.stringify(PRODUCCION,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='taller_gary_produccion_'+todayISO()+'.json'; a.click();
}
function restoreProduccionFile(input){
  const f=input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      confirmDialog('¿Reemplazar todas las filas de producción actuales por las del respaldo?', ()=>{
        PRODUCCION={seq:data.seq||1, rows:data.rows||[]};
        saveProduccion(); render(); toast('Respaldo restaurado.');
      });
    }catch(e){ toast('Archivo inválido.','error'); }
  };
  r.readAsText(f); input.value='';
}

/* ============================ RELOJ ============================ */
function tick(){ const d=new Date();
  document.getElementById('clock').textContent=d.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
}
tick(); setInterval(tick,30000);

/* ============================ INICIO ============================ */
go('inicio');
</script>
